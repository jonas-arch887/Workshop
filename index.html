<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Frachthub · Analyse-Workshop</title>
<link rel="icon" type="image/png" href="assets/logo-mark-white.png" />
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  /* =====================================================
     FrachtHub Analyse-Workshop — dunkles Erlebnis
     ===================================================== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  #root { height: 100%; }

  :root {
    /* accent defaults (overridden by data-accent) */
    --accent: #2E968A;
    --accent-bright: #5DCAAD;
    --accent-glow: rgba(46,150,138,0.16);
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.14);
    --ink-0: #020617;
    --ink-1: #060B1A;
    --ink-2: #0B1220;
    --surface: rgba(255,255,255,0.026);
    --surface-2: rgba(255,255,255,0.04);
    --txt-1: #F2F5F8;
    --txt-2: #AEB7C4;
    --txt-3: #6F7B8C;
  }
  html[data-accent="dezent"] {
    --accent: #2E968A; --accent-bright: #3FB39F; --accent-glow: rgba(46,150,138,0.12);
  }
  html[data-accent="leuchtend"] {
    --accent: #5DCAAD; --accent-bright: #7FE0C4; --accent-glow: rgba(93,202,173,0.22);
  }

  body {
    background: var(--ink-0);
    color: var(--txt-2);
    font-family: var(--font-sans);
    overflow: hidden;
  }

  .app { height: 100%; position: relative; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }
  * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.12) transparent; }

  /* ---- background variations ---- */
  .app::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    transition: opacity .5s ease, background .5s ease;
  }
  html[data-bg="ink"] .app::before {
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(255,255,255,0.035), transparent 60%),
      var(--ink-0);
  }
  html[data-bg="glow"] .app::before {
    background:
      radial-gradient(900px 600px at 15% 0%, var(--accent-glow), transparent 55%),
      radial-gradient(1100px 700px at 100% 100%, rgba(15,118,110,0.10), transparent 55%),
      linear-gradient(160deg, var(--ink-1), var(--ink-0) 60%);
  }
  html[data-bg="textur"] .app::before {
    background-color: var(--ink-0);
    background-image:
      radial-gradient(700px 500px at 85% -5%, var(--accent-glow), transparent 60%),
      radial-gradient(circle at center, rgba(255,255,255,0.05) 1px, transparent 1.4px);
    background-size: auto, 26px 26px;
  }

  /* ---- top progress bar ---- */
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.06); z-index: 40; }
  .topbar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-bright)); box-shadow: 0 0 14px var(--accent-glow); transition: width .5s var(--ease-out); }

  /* ---- layout ---- */
  .layout { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: 312px 1fr; }

  /* ================= RAIL ================= */
  .rail {
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,0.018), rgba(255,255,255,0));
    padding: 34px 26px 22px;
    display: flex; flex-direction: column; gap: 26px;
    overflow-y: auto;
  }
  .rail-logo { height: 26px; width: auto; display: block; opacity: 0.96; }
  .rail-sub { margin-top: 12px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--txt-3); font-weight: 600; }

  .rail-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .rail-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: none; border: 0; cursor: pointer; text-align: left;
    padding: 10px 10px; border-radius: 9px; color: var(--txt-3);
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    transition: background var(--dur-base) var(--ease-standard), color var(--dur-base) var(--ease-standard);
  }
  .rail-item:hover { background: var(--surface); color: var(--txt-2); }
  .rail-item.is-reached { color: var(--txt-2); }
  .rail-item.is-active { background: var(--surface-2); color: var(--txt-1); }
  .rail-label { flex: 1; line-height: 1.25; }
  .rail-prog { font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--txt-3); opacity: 0.8; }
  .rail-item.is-active .rail-prog { color: var(--accent-bright); opacity: 1; }

  .rail-tick {
    flex: none; width: 18px; height: 18px; border-radius: 50%;
    border: 1.5px solid var(--line-strong); display: grid; place-items: center;
    font-size: 10px; color: var(--ink-0); font-weight: 800;
    transition: all var(--dur-base) var(--ease-standard);
  }
  .rail-tick.is-current { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
  .rail-tick.is-complete { background: var(--accent); border-color: var(--accent); color: var(--ink-0); }

  .rail-foot { padding-top: 14px; border-top: 1px solid var(--line); }
  .save-pill { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--txt-3); transition: color var(--dur-base); }
  .save-pill.is-on { color: var(--accent-bright); }
  .save-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }

  /* ================= MAIN ================= */
  .main { overflow-y: auto; height: 100%; scroll-behavior: smooth; }
  .main-inner { max-width: 720px; margin: 0 auto; padding: 30px 40px 0; min-height: 100%; display: flex; flex-direction: column; }

  .mobile-prog { display: none; }

  .screen-wrap { flex: 1; padding-bottom: 28px; }

  /* entrance transitions — base state is VISIBLE; animation only applies once
     JS adds .anim-on (never fires under a frozen-clock capture, so content shows). */
  .screen { opacity: 1; }
  html.anim-on[data-transition="slide"] .screen { animation: scrSlide .42s var(--ease-out) both; }
  html.anim-on[data-transition="fade"]  .screen { animation: scrFade .4s ease both; }
  html.anim-on[data-transition="zoom"]  .screen { animation: scrZoom .46s var(--ease-out) both; }
  @keyframes scrSlide { from { transform: translateX(28px); } to { transform: none; } }
  @keyframes scrFade  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scrZoom  { from { transform: scale(0.965) translateY(14px); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none !important; } }

  /* ---- screen header ---- */
  .screen-head { margin-bottom: 30px; }
  .kicker { display: inline-flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 18px; }
  .kicker-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .screen-title { font-size: clamp(30px, 4vw, 42px); line-height: 1.04; letter-spacing: -0.025em; color: var(--txt-1); font-weight: 700; margin: 0 0 14px; }
  .screen-intro { font-size: 16px; line-height: 1.6; color: var(--txt-2); margin: 0; max-width: 60ch; }
  .screen-intro strong { color: var(--txt-1); font-weight: 600; }
  .cond-note {
    margin-top: 18px; display: inline-flex; align-items: center; gap: 9px;
    font-size: 12.5px; color: var(--accent-bright); background: var(--accent-glow);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    padding: 7px 13px; border-radius: 9999px;
  }
  .cond-note::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-bright); }

  /* ---- sections ---- */
  .qsection { margin-top: 34px; }
  .qsection-tag {
    display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 11px; border-radius: 9999px; margin-bottom: 18px;
  }
  .qsection-tag::before { content: ""; width: 6px; height: 6px; border-radius: 2px; }
  .qsection-tag--problem { color: #E8B894; background: rgba(214,148,84,0.12); }
  .qsection-tag--problem::before { background: #D69454; }
  .qsection-tag--lösung { color: var(--accent-bright); background: var(--accent-glow); }
  .qsection-tag--lösung::before { background: var(--accent); }

  /* ---- fields ---- */
  .fields { display: flex; flex-wrap: wrap; gap: 22px 18px; }
  .field { flex: 1 1 100%; min-width: 0; }
  .field--half { flex: 1 1 calc(50% - 9px); min-width: 200px; }
  .field-label { display: flex; gap: 11px; align-items: baseline; font-size: 15px; line-height: 1.45; color: var(--txt-1); font-weight: 500; margin-bottom: 12px; }
  .field-num { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--txt-3); font-variant-numeric: tabular-nums; transform: translateY(1px); }
  .field-help { font-size: 12.5px; color: var(--txt-3); margin: -6px 0 12px 33px; }

  .inp {
    width: 100%; background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 10px; padding: 13px 15px; color: var(--txt-1); font-family: inherit; font-size: 15px;
    transition: border-color var(--dur-base), background var(--dur-base), box-shadow var(--dur-base);
  }
  .inp::placeholder { color: var(--txt-3); }
  .inp:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,0.05); box-shadow: 0 0 0 4px var(--accent-glow); }
  .inp--area { resize: vertical; min-height: 84px; line-height: 1.55; }
  .inp--other { margin-top: 12px; }
  .inp-wrap { position: relative; display: flex; align-items: center; max-width: 280px; }
  .inp--num { -moz-appearance: textfield; }
  .inp--num::-webkit-outer-spin-button, .inp--num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .inp-suffix { position: absolute; right: 15px; font-size: 13px; color: var(--txt-3); pointer-events: none; }

  /* ---- segmented ---- */
  .seg { display: inline-flex; flex-wrap: wrap; gap: 8px; }
  .seg-btn {
    background: var(--surface); border: 1px solid var(--line-strong); color: var(--txt-2);
    padding: 11px 18px; border-radius: 9px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all var(--dur-base) var(--ease-standard);
  }
  .seg-btn:hover { border-color: var(--line-strong); background: var(--surface-2); color: var(--txt-1); }
  .seg-btn.is-on { background: var(--accent); border-color: var(--accent); color: var(--ink-0); font-weight: 700; box-shadow: 0 6px 18px var(--accent-glow); }

  /* ---- chips (multi) ---- */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--line-strong);
    color: var(--txt-2); padding: 11px 16px 11px 13px; border-radius: 9px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all var(--dur-base) var(--ease-standard);
  }
  .chip:hover { background: var(--surface-2); color: var(--txt-1); }
  .chip-tick { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; transition: all var(--dur-base); }
  .chip-tick::after { content: "✓"; font-size: 10px; font-weight: 800; color: var(--ink-0); opacity: 0; transition: opacity var(--dur-base); }
  .chip.is-on { border-color: var(--accent); color: var(--txt-1); background: var(--accent-glow); }
  .chip.is-on .chip-tick { background: var(--accent); border-color: var(--accent); }
  .chip.is-on .chip-tick::after { opacity: 1; }

  /* ---- slider ---- */
  .slider { display: flex; align-items: center; gap: 18px; max-width: 420px; }
  .slider input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent)) no-repeat, var(--line-strong); background-size: var(--p, 50%) 100%; cursor: pointer; }
  .slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-bright); box-shadow: 0 0 0 5px var(--accent-glow); cursor: pointer; border: 0; }
  .slider input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-bright); border: 0; box-shadow: 0 0 0 5px var(--accent-glow); }
  .slider-val { font-size: 22px; font-weight: 700; color: var(--txt-1); font-variant-numeric: tabular-nums; min-width: 70px; }
  .slider-val span { font-size: 14px; color: var(--txt-3); margin-left: 2px; }

  /* ---- triple ---- */
  .triple { display: flex; flex-direction: column; gap: 10px; }
  .triple-row { display: flex; align-items: center; gap: 12px; }
  .triple-rank { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--accent-glow); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); color: var(--accent-bright); display: grid; place-items: center; font-size: 13px; font-weight: 700; }

  /* ---- buttons ---- */
  .btn { display: inline-flex; align-items: center; gap: 9px; font-family: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 13px 22px; border: 1px solid transparent; transition: all var(--dur-base) var(--ease-standard); }
  .btn--primary { background: var(--accent); color: var(--ink-0); box-shadow: 0 8px 24px var(--accent-glow); font-weight: 700; }
  .btn--primary:hover { background: var(--accent-bright); transform: translateY(-1px); }
  .btn--primary:active { transform: scale(0.985); }
  .btn--ghost { background: var(--surface); border-color: var(--line-strong); color: var(--txt-2); }
  .btn--ghost:hover { background: var(--surface-2); color: var(--txt-1); }
  .btn--ghostlight { background: none; border-color: transparent; color: var(--txt-3); }
  .btn--ghostlight:hover { color: var(--txt-1); }
  .btn--lg { padding: 16px 30px; font-size: 16px; }
  .btn-arrow { transition: transform var(--dur-base) var(--ease-out); }
  .btn--primary:hover .btn-arrow { transform: translateX(3px); }

  /* ---- navbar (footer) ---- */
  .navbar { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0 22px; background: linear-gradient(180deg, transparent, var(--ink-0) 38%); margin-top: 8px; }
  .navbar-mid { font-size: 12.5px; color: var(--txt-3); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }

  /* ================= INTRO ================= */
  .screen--intro { padding-top: 22px; }
  .intro-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 22px; }
  .intro-title { font-size: clamp(34px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; color: var(--txt-1); font-weight: 800; margin: 0 0 22px; }
  .intro-title em { font-style: normal; color: var(--accent-bright); }
  .intro-lead { font-size: 17px; line-height: 1.62; color: var(--txt-2); max-width: 56ch; margin: 0 0 32px; }
  .route-motif { width: 240px; height: 40px; display: block; margin: 6px 0 34px; }
  .route-base { stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 3 7; stroke-linecap: round; }
  .route-fill { stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; filter: drop-shadow(0 0 5px var(--accent-glow)); }
  .route-motif.is-animated .route-fill { stroke-dasharray: 210; stroke-dashoffset: 210; animation: routeDraw 1.5s var(--ease-out) .2s forwards; }
  @keyframes routeDraw { to { stroke-dashoffset: 0; } }
  .route-dot { fill: var(--ink-0); stroke: var(--accent); stroke-width: 2.4; }
  .route-dot.end { fill: var(--accent); }
  .route-truck { fill: var(--accent-bright); }
  .route-motif.is-animated .route-truck { animation: truckRoll 1.5s var(--ease-out) .2s both; }
  @keyframes truckRoll { from { transform: translateX(0); } }

  .intro-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 38px; }
  .meta-item { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .meta-k { font-size: 15px; font-weight: 700; color: var(--txt-1); margin-bottom: 5px; }
  .meta-v { font-size: 12.5px; color: var(--txt-3); line-height: 1.45; }
  .intro-actions { margin-bottom: 18px; }
  .intro-fine { font-size: 12.5px; color: var(--txt-3); margin: 0; }

  /* ================= AUTH GATE ================= */
  .auth-gate {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg-body); text-align: center; padding: 40px 24px;
  }
  .auth-gate-logo { width: 160px; margin-bottom: 40px; opacity: 0.9; }
  .auth-gate-title { font-size: 28px; font-weight: 800; color: var(--txt-1); margin: 0 0 16px; }
  .auth-gate-text { font-size: 16px; color: var(--txt-2); line-height: 1.6; margin: 0; }

  /* ================= RANKING ================= */
  .rank-hint { display: flex; align-items: center; gap: 9px; margin-bottom: 22px; }
  .rank-slot { width: 26px; height: 26px; border-radius: 7px; border: 1.5px dashed var(--line-strong); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--txt-3); }
  .rank-slot.is-filled { border-style: solid; border-color: var(--accent); background: var(--accent); color: var(--ink-0); }
  .rank-hint-txt { font-size: 12.5px; color: var(--txt-3); margin-left: 6px; }
  .rank-list { display: flex; flex-direction: column; gap: 11px; }
  .rank-card { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 16px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; padding: 16px 18px; cursor: pointer; font-family: inherit; transition: all var(--dur-base) var(--ease-standard); }
  .rank-card:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line-strong); }
  .rank-card:disabled { opacity: 0.4; cursor: not-allowed; }
  .rank-card.is-ranked { border-color: var(--accent); background: var(--accent-glow); }
  .rank-badge { grid-row: 1 / 3; width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 15px; font-weight: 800; color: var(--txt-3); transition: all var(--dur-base); }
  .rank-badge.is-on { background: var(--accent); border-color: var(--accent); color: var(--ink-0); }
  .rank-area { font-size: 15.5px; font-weight: 600; color: var(--txt-1); }
  .rank-mod { font-size: 12.5px; color: var(--txt-3); }
  .rank-card.is-ranked .rank-mod { color: var(--accent-bright); }

  /* ================= SUBMIT ================= */
  .screen--submit { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 60vh; gap: 6px; }
  .submit-title { font-size: 26px; color: var(--txt-1); font-weight: 700; margin: 18px 0 6px; letter-spacing: -0.02em; }
  .submit-sub { font-size: 14px; color: var(--txt-3); max-width: 40ch; }

  /* ================= RESULT ================= */
  .screen--result { padding-top: 20px; }
  .result-check { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--ink-0); display: grid; place-items: center; margin-bottom: 26px; box-shadow: 0 10px 30px var(--accent-glow); animation: popCheck .5s var(--ease-out) both; }
  .result-check svg { width: 30px; height: 30px; }
  @keyframes popCheck { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: none; } }
  .result-title { font-size: clamp(30px, 4.4vw, 46px); }
  .result-block { margin-top: 34px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 24px 26px; }
  .result-block-h { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 18px; }
  .result-empty { font-size: 14px; color: var(--txt-3); margin: 0; }
  .prio-list { display: flex; flex-direction: column; gap: 14px; }
  .prio-row { display: flex; align-items: flex-start; gap: 16px; }
  .prio-num { flex: none; width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--ink-0); display: grid; place-items: center; font-size: 15px; font-weight: 800; }
  .prio-area { font-size: 16px; font-weight: 600; color: var(--txt-1); margin-bottom: 3px; }
  .prio-mod { font-size: 13px; color: var(--txt-2); display: flex; align-items: center; gap: 8px; }
  .prio-mod-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-bright); box-shadow: 0 0 8px var(--accent); }
  .steps-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
  .steps-list li { display: flex; gap: 15px; font-size: 14.5px; line-height: 1.55; color: var(--txt-2); }
  .steps-list strong { color: var(--txt-1); font-weight: 600; }
  .steps-n { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent-bright); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .result-actions { display: flex; gap: 12px; margin: 30px 0 16px; }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    .rail { display: none; }
    .main-inner { padding: 20px 22px 0; }
    .mobile-prog { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 24px; font-size: 13px; color: var(--txt-2); font-weight: 600; }
    .mobile-prog-count { color: var(--accent-bright); font-variant-numeric: tabular-nums; }
    .intro-meta { grid-template-columns: 1fr; }
    .field--half { flex: 1 1 100%; }
  }

  /* keep tweak panel above */
  #tweaks-root { position: relative; z-index: 60; }

  /* ===== result: report capture card ===== */
  .result-report-lead { font-size: 14px; line-height: 1.55; color: var(--txt-2); margin: 0 0 16px; }
  .result-mailrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .result-mailrow .inp { flex: 1; min-width: 220px; }
  .result-mailrow .btn { flex: none; }
  .result-mailnote { font-size: 12px; color: var(--txt-3); margin: 12px 0 0; }

  /* ===================================================
     ANALYSE-BERICHT (light, printable) overlay
     =================================================== */
  .report { position: fixed; inset: 0; z-index: 80; background: #0a0f1c; display: flex; flex-direction: column; }
  html.anim-on .report { animation: scrFade .28s ease both; }
  .report-toolbar { flex: none; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; background: var(--ink-0); border-bottom: 1px solid var(--line); }
  .report-toolbar-title { font-size: 13px; color: var(--txt-3); letter-spacing: 0.04em; }
  .rbtn { font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 9px; padding: 10px 18px; border: 1px solid transparent; transition: all var(--dur-base) var(--ease-standard); display: inline-flex; align-items: center; gap: 8px; }
  .rbtn--ghost { background: var(--surface); border-color: var(--line-strong); color: var(--txt-2); }
  .rbtn--ghost:hover { background: var(--surface-2); color: var(--txt-1); }
  .rbtn--primary { background: #0F766E; color: #fff; }
  .rbtn--primary:hover { background: #0B5E57; }
  .report-toggle { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; }
  .report-toggle button { font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 15px; background: transparent; color: var(--txt-3); border: 0; cursor: pointer; transition: background var(--dur-base), color var(--dur-base); }
  .report-toggle button + button { border-left: 1px solid var(--line-strong); }
  .report-toggle button:hover { color: var(--txt-1); }
  .report-toggle button.is-on { background: var(--accent); color: var(--ink-0); }
  .report-scroll { flex: 1; overflow-y: auto; padding: 36px 20px 60px; display: flex; justify-content: center; }
  .report-frame { flex: 1; width: 100%; border: none; min-height: 0; display: block; }
  .report-frame-loading { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--txt-3); font-size: 14px; }

  .report-doc {
    width: 820px; max-width: 100%; background: #FFFFFF; color: #1F2937;
    border-radius: 6px; box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    padding: 56px 56px 40px; font-family: var(--font-sans);
    align-self: flex-start;
  }
  .report-head { display: flex; align-items: flex-start; justify-content: space-between; padding-bottom: 22px; border-bottom: 2px solid #0F766E; }
  .report-logo { height: 24px; width: auto; }
  .report-head-meta { text-align: right; }
  .report-doc-type { font-size: 13px; font-weight: 700; color: #0F766E; letter-spacing: 0.02em; }
  .report-date { font-size: 12px; color: #6B7280; margin-top: 3px; }

  .report-hero { padding: 30px 0 8px; }
  .report-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #0F766E; margin-bottom: 12px; }
  .report-hero h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.025em; color: #020617; margin: 0 0 4px; line-height: 1.08; }
  .report-person { font-size: 15px; color: #374151; font-weight: 500; }
  .report-lead { font-size: 14px; line-height: 1.6; color: #4B5563; max-width: 60ch; margin: 16px 0 0; }

  .report-prio { margin: 30px 0 8px; background: #E6F3F1; border: 1px solid rgba(15,118,110,0.18); border-radius: 12px; padding: 24px 26px; }
  .report-prio-h { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #094842; margin-bottom: 16px; }
  .report-prio-grid { display: flex; flex-direction: column; gap: 14px; }
  .report-prio-item { display: flex; align-items: flex-start; gap: 14px; }
  .report-prio-num { flex: none; width: 28px; height: 28px; border-radius: 8px; background: #0F766E; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 800; }
  .report-prio-area { font-size: 15px; font-weight: 700; color: #020617; }
  .report-prio-mod { font-size: 12.5px; color: #0B5E57; margin-top: 1px; }

  .report-body { margin-top: 14px; }
  .report-block { padding: 26px 0; border-bottom: 1px solid #E5E7EB; }
  .report-block-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .report-block-num { flex: none; font-size: 12px; font-weight: 800; color: #9CA3AF; font-variant-numeric: tabular-nums; }
  .report-block-head h3 { font-size: 17px; font-weight: 700; color: #020617; margin: 0; letter-spacing: -0.01em; }
  .report-qa { display: flex; flex-direction: column; gap: 16px; }
  .report-row { display: grid; grid-template-columns: 1fr; gap: 5px; }
  .report-q { font-size: 13px; color: #6B7280; line-height: 1.45; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .report-tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 9999px; }
  .report-tag--p { background: #FBE8D6; color: #9A5B22; }
  .report-tag--l { background: #E6F3F1; color: #0B5E57; }
  .report-a { font-size: 15px; color: #111827; font-weight: 500; line-height: 1.5; }
  .report-a--empty { color: #9CA3AF; font-style: italic; font-weight: 400; }
  .report-a-list { margin: 2px 0 0; padding-left: 18px; font-size: 15px; color: #111827; font-weight: 500; }
  .report-a-list li { margin: 2px 0; }

  .report-next { margin-top: 28px; background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 12px; padding: 24px 26px; }
  .report-next-h { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #0F766E; margin-bottom: 14px; }
  .report-next ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
  .report-next li { font-size: 14px; line-height: 1.55; color: #374151; }
  .report-next strong { color: #020617; }

  .report-foot { margin-top: 30px; padding-top: 20px; border-top: 1px solid #E5E7EB; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
  .report-foot-name { font-size: 14px; font-weight: 700; color: #020617; }
  .report-foot-role { font-size: 12px; color: #6B7280; margin-top: 2px; }
  .report-foot-r { text-align: right; font-size: 12px; color: #6B7280; line-height: 1.6; }
  .report-sentto { margin-top: 16px; font-size: 11.5px; color: #9CA3AF; text-align: center; }

  @media (max-width: 720px) {
    .report-doc { padding: 32px 24px; }
    .report-foot, .report-foot-r { text-align: left; }
  }

  /* ===== PRINT: only the report document ===== */
  @media print {
    html, body { height: auto !important; overflow: visible !important; background: #fff !important; }
    body * { visibility: hidden !important; }
    .report, .report * { visibility: visible !important; }
    .report-toolbar { display: none !important; }
    .report { position: static !important; height: auto !important; overflow: visible !important; background: #fff !important; animation: none !important; }
    .report-scroll { overflow: visible !important; height: auto !important; padding: 0 !important; display: block !important; }
    .report-doc { box-shadow: none !important; border-radius: 0 !important; width: auto !important; max-width: none !important; padding: 0 !important; }
    .report-block, .report-prio, .report-next, .report-foot { break-inside: avoid; }
    @page { size: A4; margin: 15mm 14mm; }
  }
</style>
</head>
